
<!-- ==========================================
     InCraft — Sidebar
     templates/components/sidebar.html
     Dark + Orange Theme
     ========================================== -->

<aside class="sidebar" id="sidebar" aria-label="Main sidebar">

    <!-- BRAND HEADER -->
    <div class="sidebar-header">

        <a
            href="{{ url_for('main.dashboard') }}"
            class="brand-link"
            aria-label="InCraft Dashboard"
            title="InCraft Dashboard"
        >
            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="InCraft Logo"
                class="brand-logo"
            >

            <div class="brand-text">
                <span class="brand-name">InCraft</span>
                <span class="brand-tagline">Intelligent Inventory</span>
            </div>
        </a>

    </div>

    <!-- QUICK SEARCH -->
    <div class="sidebar-quick-actions">

        <button
            type="button"
            class="sidebar-search"
            id="sidebarSearch"
            title="Search products and records"
            aria-label="Search products and records"
        >
            <i class="fas fa-search" aria-hidden="true"></i>
            <span class="sidebar-label">Search</span>
            <span class="search-shortcut" aria-hidden="true">/</span>
        </button>

    </div>

    <!-- PRIMARY NAVIGATION -->
    <nav class="sidebar-nav" aria-label="Application navigation">

        <!-- WORKSPACE -->
        <div class="nav-section">

            <span class="nav-section-title sidebar-label">
                WORKSPACE
            </span>

            <a
                href="{{ url_for('main.dashboard') }}"
                class="nav-item {% if request.endpoint == 'main.dashboard' %}active{% endif %}"
                {% if request.endpoint == 'main.dashboard' %}aria-current="page"{% endif %}
                data-tooltip="Dashboard"
                title="Dashboard"
            >
                <i class="fas fa-th-large nav-icon" aria-hidden="true"></i>
                <span class="nav-label sidebar-label">Dashboard</span>
            </a>

            <a
                href="{{ url_for('main.inventory') }}"
                class="nav-item {% if request.endpoint == 'main.inventory' %}active{% endif %}"
                {% if request.endpoint == 'main.inventory' %}aria-current="page"{% endif %}
                data-tooltip="Inventory"
                title="Inventory"
            >
                <i class="fas fa-boxes nav-icon" aria-hidden="true"></i>
                <span class="nav-label sidebar-label">Inventory</span>
            </a>

            <a
                href="{{ url_for('main.sales') }}"
                class="nav-item {% if request.endpoint == 'main.sales' %}active{% endif %}"
                {% if request.endpoint == 'main.sales' %}aria-current="page"{% endif %}
                data-tooltip="Sales"
                title="Sales"
            >
                <i class="fas fa-shopping-cart nav-icon" aria-hidden="true"></i>
                <span class="nav-label sidebar-label">Sales</span>
            </a>

        </div>

        <!-- INSIGHTS -->
        <div class="nav-section">

            <span class="nav-section-title sidebar-label">
                INSIGHTS
            </span>

            <a
                href="{{ url_for('main.analytics') }}"
                class="nav-item {% if request.endpoint == 'main.analytics' %}active{% endif %}"
                {% if request.endpoint == 'main.analytics' %}aria-current="page"{% endif %}
                data-tooltip="Analytics"
                title="Analytics"
            >
                <i class="fas fa-chart-line nav-icon" aria-hidden="true"></i>
                <span class="nav-label sidebar-label">Analytics</span>
            </a>

            <a
                href="{{ url_for('main.activity') }}"
                class="nav-item {% if request.endpoint == 'main.activity' %}active{% endif %}"
                {% if request.endpoint == 'main.activity' %}aria-current="page"{% endif %}
                data-tooltip="Activity History"
                title="Activity History"
            >
                <i class="fas fa-history nav-icon" aria-hidden="true"></i>
                <span class="nav-label sidebar-label">Activity History</span>
            </a>

        </div>

        <!-- PREFERENCES -->
        <div class="nav-section">

            <span class="nav-section-title sidebar-label">
                PREFERENCES
            </span>

            <a
                href="{{ url_for('main.settings') }}"
                class="nav-item {% if request.endpoint == 'main.settings' %}active{% endif %}"
                {% if request.endpoint == 'main.settings' %}aria-current="page"{% endif %}
                data-tooltip="Settings"
                title="Settings"
            >
                <i class="fas fa-cog nav-icon" aria-hidden="true"></i>
                <span class="nav-label sidebar-label">Settings</span>
            </a>

        </div>

    </nav>

    <!-- BOTTOM ACCOUNT AREA -->
    <div class="sidebar-footer">

        <button
            type="button"
            class="sidebar-account"
            id="sidebarAccount"
            aria-label="Open account menu"
            aria-expanded="false"
            aria-controls="sidebarAccountMenu"
            title="Account options"
        >

            <span class="user-avatar" aria-hidden="true">
                <i class="fas fa-user"></i>
            </span>

            <span class="user-info sidebar-label">
                <span class="user-name">
                    {{ session.get('username', 'Admin') }}
                </span>
                <span class="user-role">Administrator</span>
            </span>

            <i
                class="fas fa-ellipsis account-more sidebar-label"
                aria-hidden="true"
            ></i>

        </button>

        <!-- ACCOUNT DROPDOWN -->
        <div
            class="sidebar-account-menu"
            id="sidebarAccountMenu"
            hidden
        >

            <div class="account-menu-header">
                <span class="user-avatar" aria-hidden="true">
                    <i class="fas fa-user"></i>
                </span>

                <div class="account-menu-user">
                    <strong>{{ session.get('username', 'Admin') }}</strong>
                    <span>Administrator</span>
                </div>
            </div>

            <div class="account-menu-divider"></div>

            <a
                href="{{ url_for('main.settings') }}"
                class="account-menu-item"
            >
                <i class="fas fa-user-cog" aria-hidden="true"></i>
                <span>Account settings</span>
            </a>

            <a
                href="{{ url_for('main.logout') }}"
                class="account-menu-item logout-item"
            >
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                <span>Logout</span>
            </a>

        </div>

    </div>

</aside>
