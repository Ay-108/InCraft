<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InCraft — Intelligent Inventory</title>
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') if url_for is defined else '/static/favicon.svg' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') if url_for is defined else '/static/css/styles.css' }}?v=12">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard-advanced.css') if url_for is defined else '/static/css/dashboard-advanced.css' }}?v=1">
</head>
<body>
<div class="shell">
  <aside id="sidebar">
    <div class="brand">
      <b>I</b>
      <div>
        <strong>InCraft</strong>
        <small>INTELLIGENT INVENTORY</small>
      </div>
    </div>
    <small class="label">WORKSPACE</small>
    <nav>
      <button class="active" data-page="dashboard">⌂ <span>Dashboard</span></button>
      <button data-page="inventory">▦ <span>Inventory</span></button>
      <button data-page="sales">↗ <span>Sales</span></button>
      <button data-page="analytics">◒ <span>Analytics</span></button>
      <button data-page="activity">◷ <span>Activity history</span></button>
    </nav>
    <small class="label account">ACCOUNT</small>
    <nav>
      <button data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="bottom">
      <div class="smart" id="smartInsightBtn" style="cursor:pointer;">
        ✦ 
        <div>
          <b>Smart insights</b>
          <small>Make your next move count.</small>
        </div>
        →
      </div>
      <div class="user">
        <b id="userAvatar">AR</b>
        <div>
          <strong id="userName">User</strong>
          <small id="userRole">Administrator</small>
        </div>
        <button id="logout" style="border:0;background:none;color:#999;cursor:pointer;font-size:16px;" title="Log out">↪</button>
      </div>
    </div>
  </aside>
  <main>
    <header>
      <button class="hamb" id="hamb" aria-label="Toggle menu">☰</button>
      <div class="crumb">
        <span class="crumb-root">Workspace</span>
        <span class="crumb-sep">/</span>
        <b class="crumb-active" id="crumb">Dashboard</b>
      </div>
      <div class="tools">
        <label class="search-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="globalSearch" placeholder="Search products, records...">
          <kbd>⌘ K</kbd>
        </label>
        <button class="icon-btn" id="theme" title="Toggle theme"></button>
        <button class="icon-btn" id="bell" title="Notifications">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notification-dot"></span>
        </button>
        <div class="profile-wrap">
          <button class="profile-btn" id="profileToggle" aria-expanded="false">
            <div class="profile-avatar" id="headerAvatar">AR</div>
            <div class="profile-info">
              <span class="profile-name" id="profileName">User</span>
              <span class="profile-badge" id="profileRole">ADMIN</span>
            </div>
            <svg class="chevron-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="profile-menu" id="profileMenu">
            <div class="profile-menu-head">
              <strong id="menuUserName">User</strong>
              <small id="menuUserEmail">user@example.com</small>
            </div>
            <button id="profileSettings">⚙ <span>Settings</span></button>
            <button id="profileLogout">↪ <span>Log out</span></button>
          </div>
        </div>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="backdrop"><div id="modal"></div></div>

<script id="incraft-initial" type="application/json">
  {{ initial_state | tojson | safe if initial_state is defined else '{}' }}
</script>
<script src="{{ url_for('static', filename='js/chart-loader.js') if url_for is defined else '/static/js/chart-loader.js' }}?v=1"></script>
<script src="{{ url_for('static', filename='js/app.js') if url_for is defined else '/static/js/app.js' }}?v=13"></script>
</body>
</html>
